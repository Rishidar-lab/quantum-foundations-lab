name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Full test suite
        run: pytest

      - name: NumPy vs Qiskit foundation cross-checks
        run: python -m foundations

      - name: Adversarial / mutation audit
        run: python tools/mutation_audit.py

      - name: Offline pipeline smoke test
        run: python jobs/pipeline.py --state plus --shots 2000
